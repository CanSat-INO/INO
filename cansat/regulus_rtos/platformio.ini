[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; シリアルモニタのボーレート設定
monitor_speed = 115200

; USB書き込み・CDC（シリアル通信）の設定
; 自作基板のUSB Type-Cから直接ESP32-S3のNative USBピン(GPIO19/20)に繋いでいる場合の設定
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1 ; 起動時からUSBシリアル入出力を有効化

; Flash容量 (16MB) と PSRAM (8MB Octal) の設定
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi ; N16R8はFlash:Quad, PSRAM:Octal(OPI)
board_build.f_flash = 80000000L

; パーティションテーブル（RTOSやコードサイズが大きいため16MB用を推奨）
board_build.partitions = default_16MB.csv

; Sensor bring-up programs compile only their own entry point and driver.
[env:i2c_scan]
build_src_filter = +<bringup/i2c_scan.cpp>

[env:imu_test]
build_src_filter = +<bringup/imu_test.cpp> +<drivers/QMI8658.cpp>

[env:baro_test]
build_src_filter = +<bringup/baro_test.cpp> +<drivers/HP203B.cpp>

[env:mag_test]
build_src_filter = +<bringup/mag_test.cpp> +<drivers/MMC5603.cpp>

[env:gnss_test]
build_src_filter = +<bringup/gnss_test.cpp>

[env:esp32-s3-wroom-1]
build_src_filter = +<main.cpp> +<tasks/> +<CanSatData.cpp>
