name: CanSat Simulation Tests

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - main
      - cansat-lab-stable

permissions:
  contents: read

jobs:
  test:
    name: GUI and Python tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Get source code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            tools/module_test_lab/requirements-runtime.txt
            tools/module_test_lab/requirements-test.txt

      - name: Install Qt system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libopengl0 libxkbcommon-x11-0 \
            libxcb-cursor0 libnss3 libgbm1

      - name: Install Python requirements
        run: |
          python -m pip install --only-binary=:all: \
            -r tools/module_test_lab/requirements-test.txt
          python -m pip check

      - name: Run tests
        working-directory: tools/module_test_lab
        run: |
          python -m pytest -q tests \
            --ignore=tests/test_v19_installer.py
